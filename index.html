<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cantar Inteligent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.4/mqtt.min.js"></script>
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #0b1a0e;
  --card:    #111f14;
  --card2:   #162019;
  --border:  #1e3a24;
  --green:   #3fb950;
  --accent:  #02c39a;
  --yellow:  #d29922;
  --red:     #f85149;
  --blue:    #58a6ff;
  --text:    #d4e8d0;
  --muted:   #6a9a72;
  --r:       14px;
  --gap:     14px;
  font-size: 16px;
}
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Courier New', monospace;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}
.app {
  max-width: 520px;
  margin: 0 auto;
  padding: 0 0 80px 0;
  display: flex;
  flex-direction: column;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-title { font-size: 13px; letter-spacing: 2px; color: var(--accent); font-weight: bold; }
.status-dot   { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.dot          { width: 10px; height: 10px; border-radius: 50%; background: var(--red); transition: background .4s; }
.dot.connected   { background: var(--green); box-shadow: 0 0 8px var(--green); }
.dot.connecting  { background: var(--yellow); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.tab-bar {
  display: flex;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 49px;
  z-index: 99;
}
.tab-btn {
  flex: 1;
  padding: 14px 0;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--muted);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: all .2s;
}
.tab-btn.active { color: var(--green); border-bottom-color: var(--green); }
.tab-page { display: none; flex-direction: column; gap: var(--gap); padding: var(--gap); }
.tab-page.active { display: flex; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px;
}
.card-label {
  font-size: 10px;
  letter-spacing: 2.5px;
  color: var(--muted);
  margin-bottom: 6px;
}
.weight-card {
  background: #000;
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px;
  text-align: center;
}
.weight-num {
  font-size: 64px;
  font-weight: bold;
  color: var(--green);
  line-height: 1;
  letter-spacing: -2px;
}
.weight-unit { font-size: 22px; color: var(--muted); margin-left: 4px; }
.metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
}
.metric-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 16px;
}
.metric-val { font-size: 26px; font-weight: bold; color: var(--text); transition: color .3s; }
.feet-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 12px;
}
.feet-labels {
  display: flex;
  justify-content: space-around;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--muted);
  margin-bottom: 8px;
}
#feetCanvas { display: block; width: 100%; height: auto; touch-action: none; }
.score-row {
  display: flex;
  align-items: center;
  gap: 18px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px;
}
.score-info .score-lbl { font-size: 10px; letter-spacing: 2px; color: var(--muted); margin-bottom: 4px; }
.score-info .score-txt { font-size: 14px; color: var(--text); line-height: 1.5; }
.diag-list { display: flex; flex-direction: column; gap: 7px; }
.diag-item {
  font-size: 13px;
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--card2);
  line-height: 1.4;
}
.diag-item.ok   { background: #0d2010; color: #7dd88a; }
.diag-item.warn { background: #2a1e00; color: #d29922; }
.diag-item.bad  { background: #2a0d0d; color: #f85149; }
.analysis-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.dur-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.dur-row label { font-size: 12px; color: var(--muted); letter-spacing: 1px; }
.dur-input {
  background: var(--card2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  font-family: 'Courier New', monospace;
  font-size: 16px;
  width: 110px;
  text-align: center;
}
.dur-input:focus { outline: none; border-color: var(--green); }
.progress-bg {
  height: 7px;
  background: var(--card2);
  border-radius: 4px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--green);
  border-radius: 4px;
  width: 0%;
  transition: width .9s linear;
}
.btn-row { display: flex; gap: 10px; }
.btn-analyze {
  flex: 3;
  padding: 16px;
  background: #238636;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: 'Courier New', monospace;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: background .2s;
  letter-spacing: 1px;
}
.btn-analyze:active { background: #2ea043; }
.btn-analyze:disabled { background: #1a2d21; color: var(--muted); cursor: default; }
.btn-export {
  flex: 2;
  padding: 16px;
  background: var(--card2);
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  cursor: pointer;
  transition: all .2s;
}
.btn-export.ready { color: var(--blue); border-color: var(--blue); }
.hist-empty { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 0; }
.hist-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.hist-top { display: flex; align-items: center; justify-content: space-between; }
.hist-date { font-size: 14px; font-weight: bold; color: var(--text); }
.hist-score { font-size: 16px; font-weight: bold; font-family: 'Courier New', monospace; }
.hist-summary { font-size: 12px; color: var(--text); line-height: 1.4; }
.hist-meta { font-size: 11px; color: var(--muted); }
.footer { text-align: center; font-size: 11px; color: var(--muted); padding: 12px; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <span class="header-title">CANTAR INTELIGENT</span>
    <div class="status-dot">
      <div class="dot" id="dot"></div>
      <span id="statusText">Deconectat</span>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('live',this)">LIVE</button>
    <button class="tab-btn"       onclick="switchTab('hist',this)">ISTORIC</button>
  </div>

  <div class="tab-page active" id="tab-live">

    <div class="weight-card">
      <div class="weight-num" id="weightVal">—<span class="weight-unit">kg</span></div>
    </div>

    <div class="metrics">
      <div class="metric-card"><div class="card-label">PRESIUNE MAX</div><div class="metric-val" id="pmaxVal">—</div></div>
      <div class="metric-card"><div class="card-label">ASIMETRIE</div>  <div class="metric-val" id="asymVal">—</div></div>
      <div class="metric-card"><div class="card-label">ECHILIBRU</div>  <div class="metric-val" id="balVal">—</div></div>
      <div class="metric-card"><div class="card-label">POSTURĂ</div>    <div class="metric-val" id="postVal">—</div></div>
    </div>

    <div class="feet-card">
      <div class="feet-labels"><span>PICIOR STÂNG</span><span>PICIOR DREPT</span></div>
      <canvas id="feetCanvas" width="460" height="280"></canvas>
    </div>

    <div class="score-row">
      <canvas id="scoreCanvas" width="86" height="86"></canvas>
      <div class="score-info">
        <div class="score-lbl">SCOR SĂNĂTATE</div>
        <div class="score-txt" id="scoreTxt">Apăsați «START ANALIZĂ» pentru diagnostic</div>
      </div>
    </div>

    <div class="card">
      <div class="card-label">REZULTAT DIAGNOSTIC</div>
      <div class="diag-list" id="diagList">
        <div class="diag-item">Urcați pe cântar și apăsați «START ANALIZĂ».</div>
      </div>
    </div>

    <div class="analysis-card">
      <div class="dur-row">
        <label>DURATĂ SESIUNE</label>
        <input class="dur-input" type="number" id="durInput" value="60" min="10" max="300">
      </div>
      <div class="progress-bg"><div class="progress-fill" id="progFill"></div></div>
      <div class="btn-row">
        <button class="btn-analyze" id="btnAnalyze" onclick="toggleAnalysis()">START ANALIZĂ</button>
        <button class="btn-export"  id="btnExport"  onclick="exportTxt()" disabled>EXPORT PDF</button>
      </div>
    </div>

  </div>

  <div class="tab-page" id="tab-hist">
    <div id="histList">
      <div class="hist-empty">Nu există sesiuni salvate.</div>
    </div>
  </div>

</div>

<script>
const BROKER    = 'wss://39286a92d684497a9b2997388614f284.s1.eu.hivemq.cloud:8884/mqtt';
const TOPIC     = 'plantar/date';
const MQTT_USER = 'esp32user';
const MQTT_PASS = 'Bridge123';

// Pozitii senzori 
// x: 0=stanga talpii, 1=dreapta talpii
// y: 0=degete, 1=calcai
// Pozitii senzori — x: 0 = marginea STANGA a talpii, 1 = marginea DREAPTA; y: 0 = degete, 1 = calcai
// Fiecare talpa are propriile coordonate, editabile independent.
const ORDER = [0, 8, 2, 3, 4, 10, 6,   7, 1, 13, 9, 5, 12, 11];  // implicit (nemodificat)
const POS_L = [
  [0.60, 0.12],  // S0  haluce
  [0.46, 0.18],  // S1  falange 2-3
  [0.55, 0.37],  // S2  arc medial
  [0.30, 0.26],  // S3  metatars I
  [0.38, 0.55],  // S4  arc medial 2
  [0.50, 0.70],  // S5  calcai interior
  [0.50, 0.90],  // S6  calcai exterior
];
const POS_R = [
  [0.40, 0.12],  // S7  (S0 drept) haluce
  [0.54, 0.18],  // S8  (S1 drept) falange 2-3
  [0.45, 0.37],  // S9  (S2 drept) arc medial
  [0.70, 0.26],  // S10 (S3 drept) metatars I
  [0.62, 0.55],  // S11 (S4 drept) arc medial 2
  [0.50, 0.70],  // S12 (S5 drept) calcai interior
  [0.50, 0.90],  // S13 (S6 drept) calcai exterior
];

let sensors     = new Array(14).fill(0);
let weight      = 0;
let analysisData= [];
let isAnalyzing = false;
let analyzeTimer= null;
let timerCount  = 0;
let lastReport  = null;
let history     = JSON.parse(localStorage.getItem('plantar_hist') || '[]');

const fCtx = document.getElementById('feetCanvas').getContext('2d');
const sCtx = document.getElementById('scoreCanvas').getContext('2d');

function switchTab(id, btn) {
  document.querySelectorAll('.tab-page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
  if (id === 'hist') renderHistory();
}

function heatColor(v) {
  v = Math.max(0, Math.min(1, v/255));
  if (v < 0.33) {
    const t=v/0.33;
    return `rgba(${20+38*t|0},${30+100*t|0},${180-50*t|0}`;
  } else if (v < 0.66) {
    const t=(v-0.33)/0.33;
    return `rgba(${58+197*t|0},${130+41*t|0},${130-80*t|0}`;
  } else {
    const t=(v-0.66)/0.34;
    return `rgba(255,${171-171*t|0},${50-50*t|0}`;
  }
}

const FOOT_PTS = [
  [0.35,0.08],[0.45,0.04],[0.55,0.04],[0.65,0.06],[0.70,0.10],
  [0.75,0.16],[0.78,0.24],[0.77,0.34],[0.74,0.44],[0.72,0.54],
  [0.73,0.64],[0.75,0.72],[0.73,0.82],[0.66,0.92],[0.52,0.97],
  [0.38,0.94],[0.30,0.84],[0.27,0.74],[0.26,0.64],[0.24,0.54],
  [0.23,0.44],[0.22,0.34],[0.23,0.24],[0.26,0.16],[0.30,0.10],[0.35,0.08]
];

// mirror=true oglindeste conturul talpii pe axa verticala
function footPath(ctx, ox, oy, fw, fh, mirror) {
  ctx.beginPath();
  FOOT_PTS.forEach(([x,y],i)=>{
    const px = mirror ? ox + fw - x*fw : ox + x*fw;
    const py = oy + y*fh;
    i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
  });
  ctx.closePath();
}

// ── drawFeet — stangul normal, dreptul oglindit ───────────────────────────────
function drawFeet() {
  const cv = document.getElementById('feetCanvas');
  const W=cv.width, H=cv.height;
  fCtx.clearRect(0,0,W,H);
  fCtx.fillStyle='#0b1a0e'; fCtx.fillRect(0,0,W,H);
  const pad=12, gap=20, fw=(W-2*pad-gap)/2, fh=H-2*pad;

  [
    { ox: pad,        mirror: false, pos: POS_L, vals: sensors.slice(0,7)  },  // picior stang
    { ox: pad+fw+gap, mirror: true,  pos: POS_R, vals: sensors.slice(7,14) }   // picior drept
  ].forEach(({ox, mirror, pos, vals}) => {

    // contur talpa (doar forma ramane oglindita)
    footPath(fCtx, ox, pad, fw, fh, mirror);
    fCtx.fillStyle='#0a1a0c'; fCtx.fill();
    fCtx.strokeStyle='#1e3a24'; fCtx.lineWidth=1; fCtx.stroke();

    // heatmap
    fCtx.save();
    footPath(fCtx, ox, pad, fw, fh, mirror);
    fCtx.clip();
    vals.forEach((val, i) => {
      if (val < 3) return;
      const [nx, ny] = pos[i];
      const cx = ox + nx*fw;      // pozitie directa, FARA oglindire
      const cy = pad + ny*fh;
      const r  = Math.min(fw, fh) * 0.19;
      const g  = fCtx.createRadialGradient(cx,cy,0, cx,cy,r);
      const col = heatColor(val);
      const a   = (180 * Math.min(val/120, 1)) | 0;
      g.addColorStop(0,   col + `,${a/255})`);
      g.addColorStop(0.5, col + `,${a/510})`);
      g.addColorStop(1,   col + `,0)`);
      fCtx.fillStyle = g;
      fCtx.beginPath(); fCtx.arc(cx, cy, r, 0, Math.PI*2); fCtx.fill();
    });
    fCtx.restore();

    // contur peste heatmap
    footPath(fCtx, ox, pad, fw, fh, mirror);
    fCtx.strokeStyle='#1e3a24'; fCtx.lineWidth=1; fCtx.stroke();

    // bulini senzori
    vals.forEach((val, i) => {
      const [nx, ny] = pos[i];
      const cx = ox + nx*fw;      // pozitie directa, FARA oglindire
      const cy = pad + ny*fh;
      const t  = Math.min(val/80, 1);
      fCtx.fillStyle   = t < 0.05 ? 'rgba(160,160,160,.2)' : heatColor(val) + `,.${3+(6*t)|0})`;
      fCtx.strokeStyle = t < 0.05 ? 'rgba(200,200,200,.25)' : `rgba(255,255,255,${.2+.4*t})`;
      fCtx.lineWidth = 0.8;
      fCtx.beginPath(); fCtx.arc(cx, cy, 9, 0, Math.PI*2);
      fCtx.fill(); fCtx.stroke();
    });
  });

  // linie separator
  fCtx.strokeStyle='rgba(30,58,36,.5)'; fCtx.setLineDash([4,4]); fCtx.lineWidth=1;
  fCtx.beginPath();
  fCtx.moveTo(pad + fw + gap/2, pad);
  fCtx.lineTo(pad + fw + gap/2, pad+fh);
  fCtx.stroke();
  fCtx.setLineDash([]);
}

function drawScore(s) {
  const W=86,H=86,cx=W/2,cy=H/2,r=34;
  sCtx.clearRect(0,0,W,H);
  sCtx.beginPath(); sCtx.arc(cx,cy,r,0,Math.PI*2);
  sCtx.strokeStyle='#1e3a24'; sCtx.lineWidth=7; sCtx.stroke();
  if(s>0){
    const c=s>=70?'#3fb950':s>=40?'#d29922':'#f85149';
    sCtx.beginPath(); sCtx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+(s/100)*Math.PI*2);
    sCtx.strokeStyle=c; sCtx.lineWidth=7; sCtx.lineCap='round'; sCtx.stroke();
  }
  sCtx.fillStyle='#d4e8d0'; sCtx.font='bold 22px Courier New';
  sCtx.textAlign='center'; sCtx.textBaseline='middle';
  sCtx.fillText(s,cx,cy);
}

function runDiagnostic(s) {
  const L = s.slice(0, 7), R = s.slice(7, 14);
  const lines = []; let pen = 0;

  //1 & 2: Platfus / Pes cavus (pe fiecare picior) ──
  [L, R].forEach((side, si) => {
    const lbl = si === 0 ? 'stâng' : 'drept';
    const total     = side.reduce((a, b) => a + b, 0) || 1;
    const arcPct    = (side[2] + side[4]) / total * 100;
    const degetePct = (side[0] + side[1]) / total * 100;
    const calcaiPct = (side[5] + side[6]) / total * 100;

    if (side[2] > 25) {
      lines.push({ t: 'warn', m: `Platfus (${lbl}): arc aplatizat` }); pen += 12;
    } else if (arcPct < 8 && degetePct > 30 && calcaiPct > 30) {
      lines.push({ t: 'warn', m: `Pes cavus (${lbl}): arc accentuat` }); pen += 12;
    } else {
      lines.push({ t: 'ok', m: `Boltă sănătoasă (${lbl})` });
    }
  });

  //3: Pronaţie / supinaţie (mediolateral) ──
  const diff = ((L[3] - L[2]) + (R[3] - R[2])) / 2;
  if      (diff > 12)  { lines.push({ t: 'warn', m: 'Supinație: greutate pe marginea externă' }); pen += 12; }
  else if (diff < -12) { lines.push({ t: 'warn', m: 'Pronație: greutate pe marginea internă' });  pen += 12; }
  else                   lines.push({ t: 'ok', m: 'Distribuție mediolaterală echilibrată' });

  //4: Asimetrie stânga-dreapta ──
  const sl = L.reduce((a, b) => a + b, 0), sr = R.reduce((a, b) => a + b, 0);
  const asym = Math.abs(sl - sr) / Math.max(sl + sr, 1) * 100;
  if (asym > 20) { lines.push({ t: 'warn', m: `Asimetrie ${asym.toFixed(0)}% stg/drt` }); pen += Math.min(35, asym * 1.4 | 0); }
  else             lines.push({ t: 'ok', m: `Echilibru stg/drt: ${asym.toFixed(0)}%` });

  //5: Echilibru antero-posterior (degete+metatars vs călcâi) ──
  const ant  = L[0]+L[1]+L[3] + R[0]+R[1]+R[3];
  const post = L[5]+L[6] + R[5]+R[6];
  const ap   = ant / Math.max(post, 1);
  if (ap < 0.5 || ap > 2.5) { lines.push({ t: 'warn', m: `Dezechilibru antero-posterior (raport ${ap.toFixed(1)})` }); pen += 10; }
  else                        lines.push({ t: 'ok', m: 'Echilibru antero-posterior normal' });

  // 6: Metatarsalgie (presiune metatars > 140) ──
  const metatars = Math.max(L[3], R[3]);
  if (metatars > 140) { lines.push({ t: 'warn', m: `Metatarsalgie: presiune metatars ${metatars}` }); pen += 10; }

  //7: Hallux valgus (presiune haluce > 60) ──
  const haluce = Math.max(L[0], R[0]);
  if (haluce > 60) { lines.push({ t: 'warn', m: `Hallux valgus: presiune haluce ${haluce}` }); pen += 10; }

  //8: Presiune critică (valoare maximă punctuală) ──
  const pmax = Math.max(...s);
  if      (pmax > 200) { lines.push({ t: 'bad',  m: `Presiune critică: ${pmax}` });  pen += 25; }
  else if (pmax > 140) { lines.push({ t: 'warn', m: `Presiune ridicată: ${pmax}` }); pen += 10; }
  else                   lines.push({ t: 'ok', m: `Presiune normală: ${pmax}` });

  const sc = Math.max(0, Math.min(100, 100 - pen));
  return {
    lines, score: sc, asym, pmax,
    posture: diff > 12 ? 'Supinație' : diff < -12 ? 'Pronație' : 'Neutru',
    balance: (100 - asym).toFixed(0) + '%'
  };
}

// ── LIVE: doar greutatea si heatmap-ul (diagnosticul NU se afiseaza aici) ──
function updateUI(w, s) {
  const wEl = document.getElementById('weightVal');
  wEl.innerHTML = (w > 0 ? w.toFixed(1) : '—') + '<span class="weight-unit">kg</span>';

  drawFeet();

  if (isAnalyzing) analysisData.push([...s]);
}

// ── Afiseaza diagnosticul — apelata DOAR la finalul analizei ──
function showDiagnostic(d) {
  document.getElementById('pmaxVal').textContent = d.pmax;
  document.getElementById('pmaxVal').style.color = d.pmax>200?'var(--red)':d.pmax>140?'var(--yellow)':'var(--green)';
  document.getElementById('asymVal').textContent = d.asym.toFixed(0)+'%';
  document.getElementById('asymVal').style.color = d.asym>20?'var(--red)':d.asym>10?'var(--yellow)':'var(--green)';
  document.getElementById('balVal').textContent = d.balance;
  document.getElementById('postVal').textContent = d.posture;
  document.getElementById('postVal').style.color = d.posture==='Neutru'?'var(--green)':'var(--yellow)';

  drawScore(d.score);
  const sc = d.score>=70?'#3fb950':d.score>=40?'#d29922':'#f85149';
  document.getElementById('scoreTxt').innerHTML =
    `<span style="color:${sc};font-size:18px;font-weight:bold">${d.score}/100</span><br>`+
    (d.score>=70?'Postură bună':d.score>=40?'Necesită atenție':'Consultați un specialist');

  document.getElementById('diagList').innerHTML = d.lines.map(l=>
    `<div class="diag-item ${l.t}">${l.m}</div>`).join('');
}

function toggleAnalysis() {
  if(isAnalyzing) { stopAnalysis(); return; }
  startAnalysis();
}

function startAnalysis() {
  const dur = Math.max(10, Math.min(300, parseInt(document.getElementById('durInput').value)||60));
  document.getElementById('durInput').value = dur;
  analysisData = [];
  isAnalyzing  = true;
  timerCount   = dur;
  document.getElementById('btnAnalyze').disabled = false;
  document.getElementById('btnAnalyze').textContent = `⏹ STOP  ${dur}s`;
  document.getElementById('btnExport').disabled = true;
  document.getElementById('btnExport').classList.remove('ready');
  document.getElementById('progFill').style.width = '0%';

  // curata panoul de diagnostic pe durata analizei
  document.getElementById('diagList').innerHTML =
    '<div class="diag-item">Se colectează date… nu coborâți de pe cântar.</div>';
  document.getElementById('scoreTxt').textContent = 'Analiză în curs…';
  ['pmaxVal','asymVal','balVal','postVal'].forEach(id =>
    document.getElementById(id).textContent = '—');
  drawScore(0);

  analyzeTimer = setInterval(()=>{
    timerCount--;
    const pct = ((dur-timerCount)/dur*100).toFixed(1);
    document.getElementById('progFill').style.width = pct+'%';
    document.getElementById('btnAnalyze').textContent = `STOP  ${timerCount}s`;
    if(timerCount<=0) stopAnalysis();
  }, 1000);
}

function stopAnalysis() {
  clearInterval(analyzeTimer);
  isAnalyzing = false;
  document.getElementById('btnAnalyze').textContent = 'START ANALIZĂ';
  document.getElementById('progFill').style.width = '100%';

  if(analysisData.length < 3) {
    document.getElementById('diagList').innerHTML =
      '<div class="diag-item warn">Eroare colectare date!</div>';
    document.getElementById('scoreTxt').textContent = 'Analiză eșuată';
    return;
  }

  const avg = new Array(14).fill(0).map((_,i)=>
    analysisData.reduce((s,f)=>s+f[i],0)/analysisData.length);

  if(avg.reduce((a,b)=>a+b,0)<10){
    document.getElementById('diagList').innerHTML =
      '<div class="diag-item warn">⚠ Presiune insuficientă. Stați pe cântar în timpul sesiunii.</div>';
    document.getElementById('scoreTxt').textContent = 'Fără date suficiente';
    return;
  }

  const d = runDiagnostic(avg);
  showDiagnostic(d);   // ← diagnosticul apare abia acum, pe media citirilor

  const entry = {
    date: new Date().toLocaleString('ro-RO'),
    weight: weight.toFixed(1),
    duration: parseInt(document.getElementById('durInput').value),
    score: d.score,
    posture: d.posture,
    asym: d.asym.toFixed(0),
    pmax: d.pmax,
    summary: d.lines.filter(l=>l.t!=='ok').map(l=>l.m).join(' | ') || '✓ Fără anomalii detectate',
    report: d.lines.map(l=>l.m).join('\n')
  };
  history.unshift(entry);
  if(history.length>50) history.pop();
  localStorage.setItem('plantar_hist', JSON.stringify(history));

  lastReport = entry;
  document.getElementById('btnExport').disabled = false;
  document.getElementById('btnExport').classList.add('ready');
}

function exportTxt() {
  if(!lastReport) return;
  const r = lastReport;
  const txt = [
    '=== RAPORT DIAGNOSTIC PLANTAR ===',
    `Data: ${r.date}`,
    `Greutate: ${r.weight} kg`,
    `Durata: ${r.duration} sec`,
    `Scor: ${r.score}/100`,
    `Postura: ${r.posture}`,
    `Asimetrie: ${r.asym}%`,
    `Presiune max: ${r.pmax}`,
    '',
    '=== DETALII ===',
    r.report,
    '',
    '--- Sistem Diagnostic Plantar v3.0 ---'
  ].join('\n');

  const blob = new Blob([txt], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `diagnostic_${r.date.replace(/[/:, ]/g,'_')}.txt`;
  a.click();
}

function renderHistory() {
  const el = document.getElementById('histList');
  if(!history.length) {
    el.innerHTML = '<div class="hist-empty">Nu există sesiuni salvate.</div>';
    return;
  }
  el.innerHTML = history.map(e=>{
    const sc = e.score>=70?'var(--green)':e.score>=40?'var(--yellow)':'var(--red)';
    return `<div class="hist-item">
      <div class="hist-top">
        <span class="hist-date">${e.date}</span>
        <span class="hist-score" style="color:${sc}">${e.score}/100</span>
      </div>
      <div class="hist-summary">${e.summary}</div>
      <div class="hist-meta">Greutate: ${e.weight} kg &nbsp;·&nbsp; Durată: ${e.duration}s &nbsp;·&nbsp; Postură: ${e.posture}</div>
    </div>`;
  }).join('');
}

function setStatus(state) {
  const dot=document.getElementById('dot'), txt=document.getElementById('statusText');
  dot.className='dot '+state;
  txt.textContent=state==='connected'?'Conectat':state==='connecting'?'Conectare...':'Deconectat';
}

const mqttClient = mqtt.connect(BROKER, {
  username: MQTT_USER, password: MQTT_PASS,
  clientId: 'HMI_'+Math.random().toString(16).slice(2,8),
  keepalive: 30, reconnectPeriod: 5000
});
setStatus('connecting');
mqttClient.on('connect', ()=>{ setStatus('connected'); mqttClient.subscribe(TOPIC); });
mqttClient.on('message', (t,payload)=>{
  try {
    const d=JSON.parse(payload.toString());
    if(d.s && d.s.length===14){
      const raw = d.s;
      sensors = ORDER.map(idx => raw[idx]);   // reordoneaza dupa ORDER
      weight  = d.w || 0;
      updateUI(weight, sensors);
  }
  } catch(e){}
});
mqttClient.on('disconnect', ()=>setStatus('disconnected'));
mqttClient.on('error',      ()=>setStatus('disconnected'));
mqttClient.on('reconnect',  ()=>setStatus('connecting'));

drawFeet();
drawScore(0);
</script>
